# CI profile — used exclusively by GitHub Actions test-frontend job.
# Connects to a local postgres/redis started via docker compose.
# NEVER use this profile in production (Render uses the default profile with env vars).

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clicksmile}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clicksmile}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clicksmile_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway runs migrations against local postgres (same DB as runtime)
spring.flyway.enabled=true
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clicksmile}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:clicksmile}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:clicksmile_dev}
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:clicksmile_dev}
spring.data.redis.repositories.enabled=false

# CORS: accept requests from the Angular dev server running in CI
app.cors.allowed-origins=http://localhost:4200,http://localhost:8081
app.websocket.allowed-origins=http://localhost:4200,http://localhost:8081

# JWT — same key files as default profile
app.security.jwt.issuer=clicksmile-ci
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=30d
app.security.jwt.private-key-path=classpath:security/jwt/private.pem
app.security.jwt.public-key-path=classpath:security/jwt/public.pem

# Cookies are non-secure in CI (HTTP-only environment)
app.security.cookie.secure=false
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health
