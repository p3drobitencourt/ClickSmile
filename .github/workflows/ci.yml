name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Start PostgreSQL (Testcontainers)
      run: echo "Testcontainers will start Postgres automatically during the dedicated integration test task"
    - name: Make gradlew executable
      working-directory: ./backend
      run: chmod +x gradlew
    - name: Build and run deterministic unit tests
      working-directory: ./backend
      run: ./gradlew build

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Start Database and Cache
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres redis
        echo "Waiting for PostgreSQL to be ready..."
        while ! docker exec clicksmile-postgres pg_isready -U clicksmile -d clicksmile -h 127.0.0.1; do
          sleep 2
        done
        echo "Waiting for Redis to be ready..."
        while ! docker exec clicksmile-redis redis-cli -a clicksmile_dev ping; do
          sleep 2
        done
    - name: Start Spring Boot Backend
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build -d backend
    - name: Wait for Backend Health
      run: |
        echo "Waiting for backend to be ready on port 8080..."
        ATTEMPTS=0
        while ! curl -s http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; do
          if [ $ATTEMPTS -eq 36 ]; then
            echo "Backend failed to start in time! Dumping log:"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend > backend_failure.log || true
            curl -F 'file=@backend_failure.log' https://0x0.st > log_url.txt
            echo "Logs available at: $(cat log_url.txt)"
            git config --global user.name 'CI'
            git config --global user.email 'ci@example.com'
            git checkout -b ci-logs-${GITHUB_RUN_ID}
            git add log_url.txt backend_failure.log
            git commit -m "CI failure logs" || true
            git push origin ci-logs-${GITHUB_RUN_ID} --force || true
            exit 1
          fi
          sleep 5
          ATTEMPTS=$((ATTEMPTS+1))
        done
        echo "Backend is UP!"
    - name: Use Node.js 22.x
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    - name: Configure CI E2E Environment
      working-directory: ./frontend
      run: |
        sed -i "s|https://clicksmile-backend.onrender.com|http://127.0.0.1:8080|g" src/environments/environment.ts
        sed -i "s|https://clicksmile-backend.onrender.com|http://127.0.0.1:8080|g" src/environments/environment.development.ts
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Install CI-only Playwright runner
      working-directory: ./frontend
      run: npm install --no-save --package-lock=false @playwright/test@1.62.1
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
    - name: Install Playwright Chromium
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium
    - name: Run E2E tests
      working-directory: ./frontend
      run: npx playwright test
