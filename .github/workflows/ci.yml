name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Start PostgreSQL (Testcontainers)
      run: echo "Testcontainers will start Postgres automatically during the dedicated integration test task"
    - name: Make gradlew executable
      working-directory: ./backend
      run: chmod +x gradlew
    - name: Build and run deterministic unit tests
      working-directory: ./backend
      run: ./gradlew build

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js 22.x
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Install CI-only Playwright runner
      working-directory: ./frontend
      run: npm install --no-save --package-lock=false @playwright/test@1.62.1
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
    - name: Install Playwright Chromium
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium
    - name: Run E2E tests
      working-directory: ./frontend
      run: npx playwright test
