<div class="dashboard-container">
  <header class="hero-panel">
    <div>
      <p class="eyebrow">Painel do Especialista</p>
      <h1>Visão Geral do Consultório</h1>
    </div>
  </header>

  <!-- Metrics -->
  <app-dentista-metrics 
    [consultasHoje]="5" 
    [taxaAceitacao]="92" 
    [ganhosProjetados]="'1.250,00'">
  </app-dentista-metrics>

  <div class="grid grid-cols-12 gap-6 mt-6">
    <!-- Chat Requests (Left side) -->
    <div class="col-span-12 xl:col-span-4 flex flex-col">
      <app-dentista-chat-requests [requests]="(chat.solicitacoes$ | async) || []"></app-dentista-chat-requests>
    </div>

    <!-- Calendar View (Right side) -->
    <div class="col-span-12 xl:col-span-8 bg-slate-900 rounded-xl border border-slate-700 p-6 shadow-md">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-semibold text-slate-100">Agenda Semanal Kanban</h3>
        <span class="text-xs px-2 py-1 bg-blue-500/10 text-blue-400 rounded border border-blue-500/20">Arraste para reagendar</span>
      </div>
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>
  </div>

  <!-- Agenda Config (Bottom) -->
  <div class="mt-8 bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-md">
    <h3 class="text-lg font-semibold text-slate-200 mb-4">Configurações de Horários de Trabalho</h3>
    <app-dentista-agenda 
      *ngIf="!loading"
      [loading]="loading" 
      [saving]="saving" 
      [dentistaId]="dentistaId" 
      [payload]="payload"
      (onSave)="saveAgenda($event)">
    </app-dentista-agenda>
  </div>
</div>
