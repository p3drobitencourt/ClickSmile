services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clicksmile
      SPRING_DATASOURCE_USERNAME: clicksmile
      SPRING_DATASOURCE_PASSWORD: clicksmile_dev
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/clicksmile
      SPRING_FLYWAY_USER: clicksmile
      SPRING_FLYWAY_PASSWORD: clicksmile_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: clicksmile_dev
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      APP_WEBSOCKET_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    ports:
      - "127.0.0.1:8080:8080"
